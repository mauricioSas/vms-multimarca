# Política de licencias y orígenes de las dependencias Rust que se distribuyen (PLAN-V2 §9.2).
# Dueño: arquitecto (B1, B2 piden cambios). Se comprueba en el job B1 de CI:
#   cargo deny --manifest-path native/Cargo.toml check licenses bans sources
[graph]
# Lo que se distribuye es Windows x64; la revisión también cubre las dependencias solo de Windows.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[licenses]
# Permisivas sin copyleft. Unicode-3.0, 0BSD, MIT-0 y CC0-1.0 se aceptan por decisión de la fase 0
# (PLAN-V2 §9.2). Una expresión «A OR B» vale si alguna está aquí (p. ej. r-efi: MIT o Apache-2.0 o LGPL).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Los crates propios (publish = false, licencia propietaria) no se revisan.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
