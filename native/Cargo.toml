# Espacio de trabajo Rust de la v2 (PLAN-V2 §1.3). Dueño: B1 (B2 le pide cambios para el visor).
[workspace]
resolver = "2"
members = ["common", "vmshost", "vmsctl"]

[workspace.package]
version = "2.0.0-dev.0"
edition = "2021"
license = "LicenseRef-Propietario"
publish = false
rust-version = "1.85"

[workspace.dependencies]
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
