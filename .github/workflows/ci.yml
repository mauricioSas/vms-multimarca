# Integración continua de la v2 (PLAN-V2 §1.8 y §6.1.3). Dueño: B3 (los demás bloques piden cambios).
#
# Jobs:
#   changes          qué ha cambiado (para no gastar minutos de macOS/Windows en cambios de documentación)
#   lint             ruff + mypy (estricto en vms/core)
#   pytest-ubuntu    pytest sin los e2e pesados (-m "not e2e and not slow"), orden aleatorio y cobertura
#   pytest-macos     lo mismo en macOS (arm64)
#   b1 … b6          un job por bloque: cada bloque rellena SOLO el suyo (B1 ya compila y prueba native/,
#                    también con clippy para x86_64-pc-windows-msvc, y revisa licencias con cargo-deny)
#   b3-windows       instalador en windows-latest (windows-installer.yml): build reproducible, ISCC, capturas
#                    del asistente y e2e; solo si cambia algo del instalador (salida «b3» de changes)
#   spike-s3        S3: firma TUF con SoftHSM2 (PKCS#11) + verificación con python-tuf 7
#   spike-s4         S4: servicio de Windows con cuenta virtual, Job Object y vuelta atrás (windows-latest)
#
# Minutos: macOS cuenta x10 y Windows x2 en repositorios privados. Por eso pytest-macos solo corre si cambió
# código, y spike-s4 solo si cambió su carpeta o native/common (o a mano con workflow_dispatch).
name: CI

on:
  push:
    branches: [main, v2, "v2-*", "b[1-6]-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      all:
        description: "Ejecutar todos los jobs aunque no haya cambios que los afecten"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # en push no se cancela: los minutos ya gastados no se tiran

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      native: ${{ steps.diff.outputs.native }}
      s3: ${{ steps.diff.outputs.s3 }}
      s4: ${{ steps.diff.outputs.s4 }}
      b3: ${{ steps.diff.outputs.b3 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          ALL: ${{ inputs.all }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$ALL" = "true" ]; then files="__all__";
          elif [ "$EVENT" = "pull_request" ]; then files=$(git diff --name-only "$BASE" HEAD);
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then files="__all__";
          else files=$(git diff --name-only "$BEFORE" HEAD); fi
          echo "Archivos cambiados:"; echo "$files"
          has() { [ "$files" = "__all__" ] || echo "$files" | grep -Eq "$1"; }
          code=false; native=false; s3=false; s4=false; b3=false
          # pytest (Ubuntu y macOS) solo si cambia código Python/web, pruebas, dependencias o este flujo
          # (updater/ = B4, distribution/ = B1 y B3, infra/ = Worker de B4: todos llevan pruebas en tests/)
          if has '^(vms|analytics|central|tools|tests|deploy|updater|distribution|infra)/|^pyproject\.toml$|^requirements-.*\.txt$|^\.github/workflows/ci\.yml$'; then code=true; fi
          has '^native/' && native=true || true
          has '^spikes/s3-tuf/' && s3=true || true
          has '^(spikes/s4-servicio-windows/|native/common/)' && s4=true || true
          # Instalador de Windows (B3): su build y su e2e en windows-latest solo si cambia algo que lo afecta
          has '^(distribution/|tools/build/|tests/windows/|native/|deploy/windows/|tools/fetch_mediamtx\.py$|\.github/workflows/(ci|windows-installer)\.yml$)' && b3=true || true
          { echo "code=$code"; echo "native=$native"; echo "s3=$s3"; echo "s4=$s4"; echo "b3=$b3"; } | tee -a "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Herramientas (lock de pruebas, sin dependencias transitivas sorpresa)
        run: |
          python -m pip install --no-deps -r requirements-test.txt
          python -m pip install --no-deps -e .
      - name: ruff
        run: ruff check . --output-format=github
      - name: mypy (estricto en vms/core, normal en vms/ops)
        run: mypy vms/core vms/ops

  pytest-ubuntu:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-vms.txt
            requirements-analytics.txt
            requirements-central.txt
            requirements-test.txt
      - name: ffmpeg de pruebas (solo genera flujos simulados; no forma parte del producto)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Dependencias (locks de sede con SHA-256 + lock de pruebas)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-vms.txt -r requirements-analytics.txt -r requirements-central.txt
          python -m pip install --no-deps -r requirements-test.txt
          python -m pip install --no-deps -e .
      - name: MediaMTX v1.21.1 (verificado por SHA-256)
        uses: actions/cache@v6
        with:
          path: bin
          key: mediamtx-v1.21.1-${{ runner.os }}-${{ hashFiles('tools/fetch_mediamtx.py') }}
      - run: python -m tools.fetch_mediamtx
      - name: "pytest (sin e2e pesados, orden aleatorio, cobertura mínima 80 %; se sube por bloques, nunca se baja)"
        run: >
          python -m pytest -m "not e2e and not slow" -q -rs
          --cov --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=80 --junitxml=junit-ubuntu.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-ubuntu
          path: |
            coverage.xml
            junit-ubuntu.xml
          retention-days: 14

  pytest-macos:
    needs: changes
    # macOS cuesta x10 minutos: en ramas de bloque (b1-*…b6-*) no corre; sí en main, v2 y a mano.
    if: needs.changes.outputs.code == 'true' && !startsWith(github.ref_name, 'b')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-vms.txt
            requirements-analytics.txt
            requirements-central.txt
            requirements-test.txt
      - name: ffmpeg de pruebas
        run: brew install ffmpeg
      - name: Dependencias
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-vms.txt -r requirements-analytics.txt -r requirements-central.txt
          python -m pip install --no-deps -r requirements-test.txt
          python -m pip install --no-deps -e .
      - uses: actions/cache@v6
        with:
          path: bin
          key: mediamtx-v1.21.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_mediamtx.py') }}
      - run: python -m tools.fetch_mediamtx
      - name: pytest (sin e2e pesados, orden aleatorio)
        run: python -m pytest -m "not e2e and not slow" -q -rs --junitxml=junit-macos.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-macos
          path: junit-macos.xml
          retention-days: 14

  # ------------------------------------------------------------------------------------------ bloques
  b1-plataforma:
    # Linux: fmt, clippy (también del código cfg(windows)), cargo test y cargo-deny. Windows (solo si cambia
    # native/ o a mano): criterio (4) de B1 en Windows real con native/ci/b1_windows_e2e.py.
    name: "B1 · plataforma Windows (native/) · ${{ matrix.os }}"
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.native == 'true' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}
      - name: Toolchain fijado (native/rust-toolchain.toml) + destino Windows para clippy
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup target add x86_64-pc-windows-msvc --toolchain 1.99.0
      - name: cargo fmt / clippy / test
        if: runner.os == 'Linux'
        working-directory: native
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: "clippy del código cfg(windows) (vmshost, vmsctl, common) sin gastar un runner de Windows"
        if: runner.os == 'Linux'
        working-directory: native
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: Lógica portable de S4 (referencia de vmshost para B1)
        if: runner.os == 'Linux'
        working-directory: spikes/s4-servicio-windows
        run: cargo test --locked --lib
      - name: cargo-deny (binario precompilado y verificado)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Licencias, crates prohibidos y orígenes (native/deny.toml, PLAN-V2 §9.2)
        if: runner.os == 'Linux'
        run: cargo deny --manifest-path native/Cargo.toml check licenses bans sources
      # ---- Windows real: servicios con vmshost/vmsctl, cuentas virtuales, ACL, DPAPI y runtime embebible
      - name: Toolchain fijado (Windows)
        if: runner.os == 'Windows'
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: cargo test en Windows (Job Object, DPAPI, procesos)
        if: runner.os == 'Windows'
        working-directory: native
        run: cargo test --workspace --locked
      - name: vmshost.exe y vmsctl.exe (release)
        if: runner.os == 'Windows'
        working-directory: native
        run: cargo build --release --locked -p vmshost -p vmsctl
      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencias del backend (lock de sede con SHA-256) y pytest
        if: runner.os == 'Windows'
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-vms.txt
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 pytest-timeout==2.4.0
          python -m pip install --no-deps -e .
      - name: pytest en Windows (DPAPI real, MoveFileExW, runtime)
        if: runner.os == 'Windows'
        run: python -m pytest -q -rs -p no:cacheprovider tests/core/test_winsec.py tests/core/test_atomic.py tests/distribution
      - name: Runtime embebible (Python 3.12.10 + locks de sede vms y analytics) y MediaMTX para Windows
        if: runner.os == 'Windows'
        run: |
          python -m distribution.runtime.build --out build/runtime --requirements requirements-vms.txt --requirements requirements-analytics.txt
          python -m distribution.runtime.build --out build/runtime --verify
          python -m tools.fetch_mediamtx --platform windows_amd64 --dest build/engine
      - name: Instalar, comprobar, romper, migrar y desinstalar (como administrador)
        if: runner.os == 'Windows'
        run: >
          python native/ci/b1_windows_e2e.py --build native/target/release --runtime build/runtime
          --mediamtx build/engine/mediamtx.exe --out b1-windows.json --logs b1-windows-logs
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: b1-windows
          path: |
            b1-windows.json
            b1-windows-logs/
            b1-diag.zip
          retention-days: 14

  b2-visor:
    # Visor VMS.exe (Tauri 2) en Windows real: pruebas Rust con el código de Windows, licencias, build
    # «cargo tauri build --no-bundle» y prueba de humo por CDP (tests/viewer/smoke_windows.py). Windows cuesta x2
    # minutos: solo si cambia native/ y en ramas b2-*, v2, main o a mano.
    name: "B2 · visor de escritorio (Windows: build y humo por CDP)"
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'b2-') ||
       github.ref_name == 'v2' || github.ref_name == 'main')
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      FFMPEG_ZIP_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
      FFMPEG_ZIP_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-vms.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/viewer/src-tauri/target
          key: cargo-viewer-${{ runner.os }}-${{ hashFiles('native/viewer/src-tauri/Cargo.lock', 'native/viewer/src-tauri/rust-toolchain.toml') }}
      - name: Toolchain fijado (native/viewer/src-tauri/rust-toolchain.toml)
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      # Cada paso de comprobación corre aunque falle el anterior (if: !cancelled()): una sola ejecución en Windows
      # da todos los resultados. El job falla igual si falla cualquiera.
      - name: cargo fmt
        working-directory: native/viewer/src-tauri
        run: cargo fmt --check
      - name: cargo test del visor (con el código cfg(windows) y la prueba de capacidades IPC)
        if: ${{ !cancelled() }}
        working-directory: native/viewer/src-tauri
        run: cargo test --locked
      - name: cargo clippy -D warnings (Windows)
        if: ${{ !cancelled() }}
        working-directory: native/viewer/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo-deny (binario precompilado y verificado)
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Licencias, crates prohibidos y orígenes del visor (native/deny.toml)
        if: ${{ !cancelled() }}
        run: cargo deny --manifest-path native/viewer/src-tauri/Cargo.toml --config native/deny.toml check licenses bans sources
      - name: "Build de PRUEBA: cargo tauri build --no-bundle (CLI oficial 2.12.1, con CDP)"
        id: build
        if: ${{ !cancelled() }}
        working-directory: native/viewer/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.1 build --no-bundle --ci --features prueba
      - name: Dependencias de la prueba de humo (lock de sede con SHA-256; CDP directo con websockets del lock)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-vms.txt
      - name: MediaMTX v1.21.1 (verificado por SHA-256)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: bin
          key: mediamtx-v1.21.1-${{ runner.os }}-${{ hashFiles('tools/fetch_mediamtx.py') }}
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -m tools.fetch_mediamtx
      - name: ffmpeg de pruebas (solo genera los flujos del simulador; no forma parte del producto)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: .tmp/ffmpeg
          key: ffmpeg-9.0.2-essentials-${{ runner.os }}
      - name: Descargar ffmpeg 9.0.2 (SHA-256 fijado, el mismo que el kit de S1)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $dir = '.tmp/ffmpeg'
          $exe = Get-ChildItem -Path $dir -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Invoke-WebRequest $env:FFMPEG_ZIP_URL -OutFile "$dir/ffmpeg.zip" -UseBasicParsing
            $hash = (Get-FileHash -Algorithm SHA256 "$dir/ffmpeg.zip").Hash.ToLower()
            if ($hash -ne $env:FFMPEG_ZIP_SHA256) { throw "SHA-256 de ffmpeg distinto: $hash" }
            Expand-Archive "$dir/ffmpeg.zip" -DestinationPath $dir -Force
            Remove-Item "$dir/ffmpeg.zip"
            $exe = Get-ChildItem -Path $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          }
          "VMS_TEST_FFMPEG=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prueba de humo por CDP (muro con fotogramas, IPC, sin permiso y S5)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -m tests.viewer.smoke_windows --exe native/viewer/src-tauri/target/release/VMS.exe --out visor-humo
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b2-visor
          path: |
            visor-humo/*.json
            visor-humo/*.png
            visor-humo/*.log
            native/viewer/src-tauri/target/release/VMS.exe
          retention-days: 14

  b3-instalador:
    name: "B3 · instalador (revisión sin Windows: dobles, tipos, recursos y flujos)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Herramientas (lock de pruebas)
        run: |
          python -m pip install --no-deps -r requirements-test.txt
          python -m pip install --no-deps -e .
      - name: mypy estricto en lo de B3 (distribution, tools.build)
        run: mypy --explicit-package-bases --strict --follow-imports=silent -p distribution -p tools.build
      - name: Icono e imágenes del asistente al día
        run: python -m distribution.installer.assets.make_assets --check
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/windows/doubles/target
          key: cargo-dobles-${{ runner.os }}-${{ hashFiles('tests/windows/doubles/Cargo.lock', 'tests/windows/doubles/rust-toolchain.toml') }}
      - name: Dobles de vmshost/vmsctl/visor (tests/windows/doubles) — fmt, clippy (también para Windows) y pruebas
        working-directory: tests/windows/doubles
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup target add x86_64-pc-windows-msvc --toolchain 1.99.0
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
          cargo test --locked
      - name: actionlint (flujos de GitHub Actions)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  b3-windows:
    name: "B3 · instalador en Windows"
    needs: changes
    # Windows cuesta x2 minutos: solo si cambió algo del instalador, o a mano.
    if: needs.changes.outputs.b3 == 'true'
    uses: ./.github/workflows/windows-installer.yml
    with:
      doubles: true
      e2e: true
      with_v1: true

  # B4: actualizador (tests/updater, también los fallos inyectados con procesos de verdad), firma TUF con
  # PKCS#11 en SoftHSM2 (Ubuntu), Worker con Miniflare (Node) y, en Windows real, MoveFileExW, la tubería con
  # nombre y su ACL, y WinVerifyTrust. mypy estricto en vms_updater (Ubuntu).
  b4-actualizaciones:
    name: "B4 · actualizaciones (${{ matrix.os }})"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-updater.txt
            requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Dependencias (lock del actualizador con SHA-256 + lock de pruebas)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-updater.txt
          python -m pip install --no-deps -r requirements-test.txt
          python -m pip install --no-deps -e .
      - name: SoftHSM2 (token de DESARROLLO para la firma PKCS#11; se destruye con el runner)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q softhsm2
      - name: Worker (Miniflare + workerd; sharp sustituido por un stub, sin libvips)
        working-directory: infra/update-worker
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: mypy estricto (vms_updater)
        if: runner.os == 'Linux'
        env:
          MYPYPATH: updater
        run: mypy -p vms_updater
      - name: pytest del actualizador (incluidos los procesos matados en cada estado del diario)
        run: >
          python -m pytest tests/updater tests/core/test_config_migrations.py -m "not e2e" -q -rs
          --junitxml=junit-b4-${{ runner.os }}.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b4-${{ runner.os }}
          path: junit-b4-*.xml
          retention-days: 14

  b5-drivers:
    name: "B5 · drivers y compatibilidad"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-vms.txt
            requirements-analytics.txt
            requirements-central.txt
            requirements-test.txt
      - name: ffmpeg de pruebas (publica los flujos de la matriz; no forma parte del producto)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Dependencias (locks de sede con SHA-256 + lock de pruebas, como pytest-ubuntu)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-vms.txt -r requirements-analytics.txt -r requirements-central.txt
          python -m pip install --no-deps -r requirements-test.txt
          python -m pip install --no-deps -e .
      - name: MediaMTX v1.21.1 (verificado por SHA-256)
        uses: actions/cache@v6
        with:
          path: bin
          key: mediamtx-v1.21.1-${{ runner.os }}-${{ hashFiles('tools/fetch_mediamtx.py') }}
      - run: python -m tools.fetch_mediamtx
      - name: "mypy --strict en vms/vendors (PLAN-V2 §4.1)"
        run: mypy --strict vms/vendors
      - name: "Batería de contrato, drivers, madurez y matriz de simuladores (cobertura de vms/vendors ≥ 85 %)"
        run: >
          python -m pytest tests/vendors tests/compat -q -rs -p no:cacheprovider
          --cov=vms/vendors --cov-report=term --cov-fail-under=85
      - name: "Sin presets duplicados en JS (criterio 3 de B5)"
        run: "! grep -nE 'presetPaths|Streaming/Channels|realmonitor|/unicast/|Preview_|media\\.smp|axis-media' vms/web/static/js/*.js"

  b6-operacion:
    name: "B6 · operación, IA de verificación y onboarding"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "B6 añadirá aquí tests/ops (salud de imagen, evidencias, avisos, auditoría)."
          test -f vms/ops/models.py

  # ------------------------------------------------------------------------------------------ pruebas de concepto
  spike-s3:
    name: "S3 · TUF con SoftHSM2"
    needs: changes
    if: needs.changes.outputs.s3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: SoftHSM2 (token de DESARROLLO, se destruye con el runner)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q softhsm2
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s/softhsm/tokens\nobjectstore.backend = file\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/softhsm2.conf"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/softhsm2.conf" >> "$GITHUB_ENV"
      - name: Token «vms-dev»
        run: softhsm2-util --init-token --free --label vms-dev --pin 1234 --so-pin 4321
      - name: python-tuf 7 + securesystemslib (HSMSigner usa python-pkcs11, MIT)
        run: python -m pip install "tuf==7.0.1" "securesystemslib[crypto]==1.5.1" "python-pkcs11==0.10.0"
      - name: S3 con claves software
        run: python spikes/s3-tuf/s3_tuf.py --signer software --out s3-software.json
      - name: S3 con PKCS#11 (SoftHSM2)
        run: >
          python spikes/s3-tuf/s3_tuf.py --signer pkcs11 --pkcs11-lib /usr/lib/softhsm/libsofthsm2.so
          --token-label vms-dev --pin 1234 --out s3-pkcs11.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-s3
          path: s3-*.json

  spike-s4:
    name: "S4 · servicio de Windows (windows-service-rs + Job Object + cuenta virtual)"
    needs: changes
    if: needs.changes.outputs.s4 == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            spikes/s4-servicio-windows/target
          key: cargo-s4-${{ runner.os }}-${{ hashFiles('spikes/s4-servicio-windows/Cargo.lock', 'native/common/**') }}
      - name: Toolchain fijado (rust-toolchain.toml)
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Compilar (release)
        working-directory: spikes/s4-servicio-windows
        run: cargo build --release --locked
      - name: Instalar, arrancar, consultar, romper, parar y desinstalar
        shell: pwsh
        run: ./spikes/s4-servicio-windows/run-s4.ps1 -BuildDir spikes/s4-servicio-windows/target/release -Out s4-result.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-s4
          path: |
            s4-result.json
            s4-files/
