# Kit de la prueba S1 (PLAN-V2 §4.7): compila el visor mínimo Tauri en windows-latest y deja un zip con
# s1-visor.exe + s1.ps1 + GUIA.md para ejecutarlo en el PC Windows del laboratorio. Sin firmar (todavía no
# hay certificado Authenticode: decisión de la noche del 5/10). Dueño: B3 (hasta que B2 lo absorba).
name: S1 kit

on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths: ["spikes/s1-webview2/**", ".github/workflows/s1-kit.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            spikes/s1-webview2/app/src-tauri/target
          key: cargo-s1-${{ runner.os }}-${{ hashFiles('spikes/s1-webview2/app/src-tauri/Cargo.lock') }}
      - name: Toolchain fijado
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Iconos (generados, no se guardan binarios en el repositorio)
        run: |
          python -m pip install "pillow==12.3.0"
          python spikes/s1-webview2/app/make_icons.py
      - name: Compilar el visor (release)
        working-directory: spikes/s1-webview2/app/src-tauri
        run: cargo build --release --locked
      - name: Montar el kit
        shell: pwsh
        run: |
          $kit = New-Item -ItemType Directory -Force -Path s1-kit
          Copy-Item spikes/s1-webview2/app/src-tauri/target/release/s1-visor.exe $kit
          Copy-Item spikes/s1-webview2/s1.ps1, spikes/s1-webview2/GUIA.md $kit
          Get-FileHash -Algorithm SHA256 "$kit/*" | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } |
            Set-Content "$kit/SHA256SUMS.txt" -Encoding ascii
          Get-ChildItem $kit | Format-Table Name, Length
      - name: Comprobación rápida (los scripts son PowerShell válido)
        shell: pwsh
        run: |
          $errs = $null; $errs2 = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/s1-kit/s1.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | Format-List; throw 's1.ps1 tiene errores de sintaxis' }
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/spikes/s4-servicio-windows/run-s4.ps1", [ref]$null, [ref]$errs2)
          if ($errs2) { $errs2 | Format-List; throw 'run-s4.ps1 tiene errores de sintaxis' }
      - uses: actions/upload-artifact@v7
        with:
          name: s1-kit
          path: s1-kit/
          retention-days: 30
