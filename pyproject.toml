[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vms-multimarca"
version = "0.1.0"
description = "VMS multimarca (Hikvision, Dahua, ONVIF) con vista en vivo, grabación, reproducción y analítica de tienda"
requires-python = ">=3.12,<3.13"
license = { text = "Propietario" }
readme = "LEEME.md"
# Núcleo común (vms.core): lo necesitan todos los componentes.
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0",
    "keyring>=25",
    "cryptography>=43",
    "httpx>=0.28",
    "pyyaml>=6",
]

[project.optional-dependencies]
# PC de control / sede: backend FastAPI + motor MediaMTX + integración de fabricantes.
vms = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "argon2-cffi>=23",
    "onvif-zeep-async>=4.3",
    "psutil>=6",
    "psycopg[binary]>=3.2",
    # v2 (B6, salud de imagen en el backend: también en puestos sin analítica). OpenCV clásico, sin modelos.
    "numpy>=2",
    "opencv-python-headless>=4.10",
]
# Analítica en la sede: SOLO inferencia (modelo RF-DETR ya exportado a ONNX/OpenVINO).
# No incluye torch: en Linux arrastraría las wheels CUDA (varios GB) a un mini PC sin GPU.
# OJO: supervision declara PyAV (FFmpeg GPL); instalar con los lock y --no-deps (CONTRATO §10).
analytics = [
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "supervision>=0.26",
    "trackers>=2.6",
    "openvino>=2025.0",
    "onnxruntime>=1.20",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]
# Exportación del modelo (máquina de desarrollo/CI): RF-DETR + torch → ONNX/OpenVINO.
# Solo tamaños con licencia Apache-2.0: nano, small, medium, base. Nunca XL/2XL (PML).
export = [
    "rfdetr>=1.11",
    "onnx>=1.16",          # Apache-2.0; lo necesita torch.onnx.export dentro de rfdetr.export()
    "openvino>=2025.0",
    "onnxruntime>=1.20",
]
# Panel central multi-sede + informe semanal (proveedor LLM configurable).
central = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "argon2-cffi>=23",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "anthropic>=0.40",
]
# Actualizador VMSUpdater (B4): runtime mínimo de las ranuras A/B (updater\\slot-a|b). Licencias verificadas
# el 5-oct-2026 (metadatos de PyPI): tuf Apache-2.0 OR MIT, securesystemslib MIT, urllib3 MIT.
updater = [
    "tuf>=7.0.1,<8",
    "securesystemslib[crypto]>=1.5.1,<2",
    "urllib3>=2,<3",
]
# Herramientas de prueba y calidad (sin dependencias de producto). Licencias verificadas el
# 5-oct-2026 (PyPI): ruff MIT, mypy MIT (+ mypy_extensions MIT, librt MIT, ast-serialize MIT,
# pathspec MPL-2.0), pytest-cov MIT (+ coverage Apache-2.0), pytest-randomly MIT, types-PyYAML
# Apache-2.0. Nada de esto se distribuye en el instalador. Lo usa CI con los locks de sede.
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-cov>=7",
    "pytest-randomly>=5",
    "respx>=0.21",
    "playwright>=1.48",
    "pgserver>=0.1.4",
    "pip-licenses>=5",
    "ruff>=0.16",
    "mypy>=2.4",
    "types-PyYAML>=6",
    # B4: pruebas del actualizador y de tools/release (firma PKCS#11 con SoftHSM: python-pkcs11 MIT, asn1crypto MIT)
    "tuf>=7.0.1,<8",
    "securesystemslib[crypto]>=1.5.1,<2",
    "python-pkcs11>=0.10,<1",
]
dev = [
    "vms-multimarca[vms,analytics,central,export,updater,test]",
]

[project.scripts]
vms-migrate = "vms.db.migrate:main"

[tool.setuptools.packages.find]
include = ["vms*", "analytics*", "central*"]
exclude = ["tests*", "tools*", "legacy*"]

[tool.setuptools.package-data]
"vms.db" = ["migrations/*.sql"]
"vms.web" = ["**/*"]
"central" = ["web/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 180
# pytest-randomly (orden aleatorio) está activo: la semilla sale en la cabecera. Para repetir un
# orden concreto: --randomly-seed=<n>; para desactivarlo: -p no:randomly.
addopts = "-ra --strict-markers"
markers = [
    "slow: pruebas lentas (procesos externos, vídeo, modelos)",
    "e2e: pruebas extremo a extremo con simulador y MediaMTX reales",
    "needs_ffmpeg: necesita ffmpeg en el equipo de desarrollo",
    "needs_mediamtx: necesita el binario de MediaMTX (bin/ o VMS_MEDIAMTX_BIN)",
    "needs_postgres: necesita PostgreSQL (pgserver o VMS_TEST_PG_DSN)",
    "needs_browser: necesita Chromium de Playwright",
    "needs_model: necesita pesos de RF-DETR descargados",
]
filterwarnings = [
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["legacy", "native", "spikes/s1-webview2"]

[tool.ruff.lint]
# Conjunto clásico (pyflakes + errores de pycodestyle) + bugbear. Se amplía por bloques, nunca a la baja.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]   # Depends()/Query() de FastAPI en los valores por defecto es el patrón documentado

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["^legacy/", "^tests/", "^spikes/", "^native/", "^build/", "^dist/"]

# PLAN-V2 §4.1: estricto en vms/core (fase 0); B5 lo extiende a vms/vendors y B4 a updater.
[[tool.mypy.overrides]]
module = ["vms.core.*"]
strict = true

# B4: el actualizador también en estricto (mypy updater/vms_updater). python-tuf reexporta sus clases desde
# tuf.api.metadata y tuf.ngclient sin __all__ explícito en todos los nombres.
[[tool.mypy.overrides]]
module = ["vms_updater.*"]
strict = true

[[tool.mypy.overrides]]
module = ["tuf.*"]
implicit_reexport = true

[tool.coverage.run]
source = ["vms", "analytics", "central"]
omit = ["*/__main__.py"]

[tool.coverage.report]
skip_empty = true
precision = 1
