<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Iniciar sesión · VMS Multimarca</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="card auth-card" aria-labelledby="login-title">
      <div class="brand"><div class="brand-mark" aria-hidden="true"></div>
        <div><div class="brand-name">VMS</div><div class="brand-sub">Multimarca</div></div></div>
      <h1 id="login-title">Iniciar sesión</h1>
      <p class="lead">Escribe tu usuario y contraseña del VMS.</p>
      <div id="setup-banner" class="banner info" hidden>
        <span>Todavía no hay usuarios. <a href="/setup">Crea el administrador</a> desde este equipo.</span>
      </div>
      <form id="login-form" method="post" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input class="input" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="btn btn-primary" type="submit" id="login-submit" disabled>Entrar</button>
      </form>
    </section>
  </main>
  <script type="module" src="/static/js/login.js"></script>
</body>
</html>
