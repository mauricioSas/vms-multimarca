<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reproducción · VMS Multimarca</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/playback.css">
</head>
<body>
<div class="shell">
  <aside id="sidebar" class="sidebar"></aside>
  <div>
    <button type="button" id="menu-toggle" class="btn menu-toggle" aria-expanded="false" aria-controls="sidebar"></button>
    <main class="main">
      <header class="page-head">
        <div>
          <div class="kicker">Grabaciones</div>
          <h1>Reproducción</h1>
        </div>
      </header>

      <div class="card card-pad pb-controls">
        <div class="field">
          <label for="pb-camera">Cámara</label>
          <select class="input" id="pb-camera"></select>
        </div>
        <div class="field">
          <label for="pb-date">Día</label>
          <input class="input" type="date" id="pb-date">
        </div>
        <div class="field">
          <span id="zoom-label">Escala</span>
          <div class="segmented" role="group" aria-labelledby="zoom-label" id="pb-zoom">
            <button type="button" data-hours="24" aria-pressed="true">24 h</button>
            <button type="button" data-hours="6">6 h</button>
            <button type="button" data-hours="1">1 h</button>
          </div>
        </div>
        <button type="button" class="btn" id="pb-reload">Actualizar</button>
      </div>

      <section class="card pb-stage" aria-label="Vídeo grabado">
        <div class="pb-video-wrap">
          <video id="pb-video" playsinline preload="auto" aria-label="Vídeo grabado"></video>
          <div class="pb-overlay" id="pb-overlay">
            <strong>Elige un momento en la línea de tiempo</strong>
            <span>Los tramos de color son los periodos grabados.</span>
          </div>
          <div class="pb-clock" id="pb-clock" aria-live="off">--:--:--</div>
        </div>
        <div class="pb-transport" role="toolbar" aria-label="Controles de reproducción">
          <button type="button" class="btn btn-sm" data-seek="-60" title="Retroceder 1 minuto">−1 min</button>
          <button type="button" class="btn btn-sm" data-seek="-10" title="Retroceder 10 segundos">−10 s</button>
          <button type="button" class="btn btn-primary btn-sm pb-play" id="pb-play" disabled>Reproducir</button>
          <button type="button" class="btn btn-sm" data-seek="10" title="Avanzar 10 segundos">+10 s</button>
          <button type="button" class="btn btn-sm" data-seek="60" title="Avanzar 1 minuto">+1 min</button>
          <div class="field pb-rate">
            <label for="pb-rate" class="sr-only">Velocidad</label>
            <select class="input" id="pb-rate">
              <option value="0.5">0,5×</option><option value="1" selected>1×</option>
              <option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
            </select>
          </div>
          <span class="muted small" id="pb-position"></span>
        </div>

        <div class="timeline" id="timeline" tabindex="0" role="slider" aria-label="Línea de tiempo del día"
             aria-valuemin="0" aria-valuemax="86400" aria-valuenow="0" aria-valuetext="">
          <div class="timeline-ticks" id="timeline-ticks"></div>
          <div class="timeline-track" id="timeline-track">
            <div class="timeline-spans" id="timeline-spans"></div>
            <div class="timeline-hover" id="timeline-hover" hidden></div>
            <div class="timeline-head" id="timeline-head" hidden></div>
          </div>
        </div>
        <div class="timeline-nav">
          <button type="button" class="btn btn-ghost btn-sm" id="tl-prev" aria-label="Ver antes">◀</button>
          <span class="muted small" id="timeline-range"></span>
          <button type="button" class="btn btn-ghost btn-sm" id="tl-next" aria-label="Ver después">▶</button>
          <span class="muted small" id="timeline-summary" style="margin-left:auto"></span>
        </div>
      </section>

      <section class="card card-pad pb-export" aria-labelledby="h-export">
        <h2 id="h-export">Descargar clip</h2>
        <div class="pb-export-row">
          <div class="field">
            <label for="clip-start">Desde</label>
            <input class="input mono" type="time" step="1" id="clip-start">
          </div>
          <div class="field">
            <label for="clip-duration">Duración</label>
            <select class="input" id="clip-duration">
              <option value="30">30 segundos</option><option value="60" selected>1 minuto</option>
              <option value="300">5 minutos</option><option value="600">10 minutos</option>
              <option value="1800">30 minutos</option><option value="3600">1 hora</option>
            </select>
          </div>
          <button type="button" class="btn" id="clip-from-position">Usar la posición actual</button>
          <a class="btn btn-primary" id="clip-download" href="#" download aria-disabled="true">Descargar MP4</a>
        </div>
        <p class="muted small" style="margin:10px 0 0">El clip se genera desde la grabación original, sin recomprimir.</p>
      </section>
    </main>
  </div>
</div>
<script type="module" src="/static/js/playback.js"></script>
</body>
</html>
